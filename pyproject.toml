[project]
name = "marketing-agent"
version = "0.1.0"
description = "Marketing & sales agent: find leads with Hunter.io and Instagram, draft outreach with Claude, send via Gmail after human approval"
readme = "README.md"
authors = [
    { name = "Karthik Raja", email = "karthiks233@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11.0",
    "boto3>=1.43.109",
    "fastapi>=0.115",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "pycountry>=26.2.16",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn>=0.30",
]

[project.scripts]
agent = "marketing_agent.cli:app"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
infra = [
    "aws-cdk-lib>=2.272.0",
    "constructs>=10.8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
